[project]
name = "cmux-mcp"
version = "0.1.0"
description = "MCP server for cmux terminal automation (macOS only)"
requires-python = ">=3.14"
license = "BSD-3-Clause"
authors = [
    {name = "Les Leslie", email = "les@wedgwoodwebworks.com"},
]
dependencies = [
    "fastmcp>=3.4,<4",
    "oneiric>=0.21.0",
    "mcp-common>=0.26,<0.27",
    "pydantic>=2.13.4",
    "pydantic-settings>=2",
    "httpx>=0.27",
    "psutil>=7.2.2",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "crackerjack>=0.20",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
cmux-mcp = "cmux_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cmux_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: unit tests",
    "integration: integration tests (require live cmux)",
    "e2e: end-to-end tests",
]